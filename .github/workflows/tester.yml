name: Tester

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sim:
    # Determinismtestet jämför mot en inskriven kontrollsumma, så det ska vara grönt på båda.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test --configuration Release

  spel:
    # Bygger Godot-projektets C#-kod mot simuleringen. Godot själv behövs inte för det.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build game/Hallonkriget.csproj --configuration Release
